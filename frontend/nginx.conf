server {
  listen 80;
  root /usr/share/nginx/html;

  # The dashboard calls /api/*; forward to the FastAPI service without the prefix.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # Client-side routes (/runs/:id, /experiments/:id, ...) all serve the SPA.
  location / {
    try_files $uri /index.html;
  }
}
