name: CI

# Lint -> unit tests -> integration tests (+ migrations on PostgreSQL) -> evaluation
# regression suite -> Docker images -> end-to-end dashboard test on the full stack.
# Every stage uses the mock provider: CI never calls a paid model API and needs no secrets.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Backend (ruff)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (oxlint + type-check)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Backend unit tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -m "not integration and not evaluation"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Streamlit demo tests
        working-directory: streamlit_app
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -r requirements.txt pytest
          .venv/bin/python -m pytest tests -q

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenteval
          POSTGRES_PASSWORD: agenteval
          POSTGRES_DB: agenteval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenteval"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -m integration
      - name: Migrations apply, match the models, and roll back
        working-directory: backend
        env:
          AGENTEVAL_DATABASE_URL: postgresql+psycopg://agenteval:agenteval@localhost:5432/agenteval
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python -m app.costs.seed

  evaluation:
    name: Evaluation regression suite
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -m evaluation -v

  docker:
    name: Build Docker images
    needs: evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: agenteval-api:ci
      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: agenteval-web:ci

  e2e:
    name: End-to-end (dashboard on the full stack)
    needs: docker
    runs-on: ubuntu-latest
    env:
      # Throwaway key for this CI stack only; registered (hashed) at API startup.
      AGENTEVAL_BOOTSTRAP_API_KEY: ae_ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}-local-only
      AGENTEVAL_RATE_LIMIT_PER_MINUTE: "600"
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          curl -sf http://localhost:3000/api/health
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        env:
          E2E_API_KEY: ${{ env.AGENTEVAL_BOOTSTRAP_API_KEY }}
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
